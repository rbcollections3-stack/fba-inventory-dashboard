name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fba_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fba_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database fba_test"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database fba_e2e"
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and database tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
